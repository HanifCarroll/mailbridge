[package]
name = "mailbridge"
version = "0.1.0"
edition = "2024"
description = "Mailbox bridge with one JSON CLI over Gmail via gws and Fastmail JMAP, including draft-only compose."
license = "MIT"
repository = "https://github.com/HanifCarroll/mailbridge"
homepage = "https://github.com/HanifCarroll/mailbridge"
readme = "README.md"
keywords = ["email", "gmail", "jmap", "cli", "automation"]
categories = ["command-line-utilities", "email"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
